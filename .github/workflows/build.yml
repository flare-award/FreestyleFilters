name: Build ScreenFX

on:
  push:
    branches: [ main, "arena/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore -p:Platform=x64

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Publish self-contained
        run: dotnet publish src/ScreenFX.App/ScreenFX.App.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=false -o publish/ScreenFX

      - name: List publish
        run: dir publish\ScreenFX
        shell: pwsh

      - name: Install Inno Setup
        run: choco install innosetup -y
        shell: pwsh

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/ScreenFX.iss
          dir artifacts
        shell: pwsh

      - name: Upload artifacts - publish
        uses: actions/upload-artifact@v4
        with:
          name: ScreenFX-portable-win-x64
          path: publish/ScreenFX
          retention-days: 30

      - name: Upload artifacts - installer
        uses: actions/upload-artifact@v4
        with:
          name: ScreenFX-installer-win-x64
          path: artifacts/*.exe
          retention-days: 30

  build-linux-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run filter math checks
        run: |
          python tests/python/test_filter_math.py
