name: Build ScreenFX

on:
  push:
    branches: [ main, "arena/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  checks: write

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        shell: bash
        run: |
          set -o pipefail
          dotnet --info
          dotnet nuget list source
          dotnet restore --verbosity normal 2>&1 | tee restore.log

      - name: Post restore log as commit comment on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('restore.log', 'utf8'); } catch(e) { log = 'no log file: ' + e; }
            log = log.substring(0, 60000);
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '❌ Restore failed:\n```\n' + log + '\n```'
            });

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          dotnet build --configuration Release --verbosity minimal 2>&1 | tee build.log

      - name: Post build log on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('build.log', 'utf8'); } catch(e) { log = 'no build log'; }
            log = log.substring(0, 60000);
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '❌ Build failed:\n```\n' + log + '\n```'
            });

      - name: Test
        run: dotnet test --configuration Release --verbosity minimal

      - name: Publish self-contained
        run: dotnet publish src/ScreenFX.App/ScreenFX.App.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=false -o publish/ScreenFX

      - name: List publish
        run: dir publish\ScreenFX
        shell: pwsh

      - name: Install Inno Setup
        run: choco install innosetup -y
        shell: pwsh

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/ScreenFX.iss
          dir artifacts
        shell: pwsh

      - name: Upload artifacts - publish
        uses: actions/upload-artifact@v4
        with:
          name: ScreenFX-portable-win-x64
          path: publish/ScreenFX
          retention-days: 30

      - name: Upload artifacts - installer
        uses: actions/upload-artifact@v4
        with:
          name: ScreenFX-installer-win-x64
          path: artifacts/*.exe
          retention-days: 30

  build-linux-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run filter math checks
        run: |
          python tests/python/test_filter_math.py
